<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --fg:#1f2328; --bg:#fbfbfd; --muted:#59636e; --line:#d8dee4; --code:#eff1f3; --accent:#6d4aff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6e6e6; --bg:#16171b; --muted:#a0a4ab; --line:#33363d; --code:#23252b; --accent:#a18cff; } }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 860px; padding: 32px 20px 80px; color: var(--fg); background: var(--bg);
         font: 16px/1.75 "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
  h1 { font-size: 28px; margin: 0 0 20px; } h2 { font-size: 21px; margin-top: 40px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 17px; margin-top: 28px; }
  a { color: var(--accent); }
  code { background: var(--code); padding: 2px 6px; border-radius: 5px; font-size: 14px; font-family: Consolas, "Cascadia Mono", monospace; }
  pre { background: var(--code); padding: 14px 16px; border-radius: 8px; overflow-x: auto; } pre code { padding: 0; }
  blockquote { margin: 16px 0; padding: 8px 16px; border-left: 4px solid var(--accent); color: var(--muted); background: var(--code); border-radius: 0 8px 8px 0; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; } th { background: var(--code); }
</style>
