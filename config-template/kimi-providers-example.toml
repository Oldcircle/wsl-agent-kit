# Kimi Code 第三方模型配置示例(~/.kimi-code/config.toml)
# 默认用 Kimi 官方模型时【不需要】这个文件;只有想让 Kimi Code 跑别家模型才用。
# 参考文档:https://www.kimi.com/code/docs/kimi-code-cli/configuration/config-files.html

# --- 示例 1:GLM Coding Plan(智谱包月套餐,Anthropic 兼容端点) ---
